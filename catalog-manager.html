<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog Manager</title><link rel="stylesheet" href="styles.css"><style>.manager{max-width:950px;margin:30px auto;padding:0 14px}.box{background:#fffdf9;border:1px solid var(--line);border-radius:24px;padding:18px;margin:12px 0}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form input,.form textarea,.form select{border:1px solid var(--line);border-radius:12px;padding:11px}.form textarea{grid-column:1/-1;min-height:90px}.rows{display:grid;gap:8px}.r{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:8px}.r img{width:60px;height:60px;object-fit:contain;background:#fff;border-radius:9px}.r b{font-size:11px}.r span{font-size:10px;color:var(--muted)}@media(max-width:600px){.form{grid-template-columns:1fr}.r{grid-template-columns:50px 1fr}.r>div:last-child{grid-column:1/-1}}</style></head><body><div class="manager"><a href="index.html">← Back to Store</a><div class="box"><h1 style="font-family:Georgia,serif;font-weight:400">Catalog Manager</h1><p style="color:var(--muted);font-size:12px">Each product now supports up to 6 image URLs. Add official image URLs here, download products.json, then replace the file in GitHub.</p></div>
<div class="box form"><input id="title" placeholder="Product title"><input id="vendor" placeholder="Brand"><input id="type" placeholder="Product type"><select id="category"><option>Skin Care</option><option>Makeup</option><option>Hair Care</option></select><input id="price" type="number" placeholder="Price PKR"><input id="stock" type="number" placeholder="Stock"><input id="image1" placeholder="Image 1 URL"><input id="image2" placeholder="Image 2 URL"><input id="image3" placeholder="Image 3 URL"><input id="image4" placeholder="Image 4 URL"><input id="image5" placeholder="Image 5 URL"><input id="image6" placeholder="Image 6 URL"><textarea id="description" placeholder="Description"></textarea><button class="btn btnDark" onclick="saveProduct()">Add / Save Product</button><button class="btn" onclick="downloadJson()">Download products.json</button></div><div class="box"><div id="rows" class="rows"></div></div></div>
<script>let data=[],editId=null;async function init(){data=await fetch('products.json').then(r=>r.json());render()}function render(){rows.innerHTML=data.map(p=>`<div class="r"><img src="${p.image}"><div><b>${p.title}</b><span>${p.vendor} • ${p.category||''} • PKR ${p.price}</span></div><div><button onclick="edit(${p.id})">Edit</button> <button onclick="del(${p.id})">Delete</button></div></div>`).join('')}function saveProduct(){const imgs=[1,2,3,4,5,6].map(n=>document.getElementById('image'+n).value.trim()).filter(Boolean),obj={title:title.value.trim(),vendor:vendor.value.trim(),type:type.value.trim(),category:category.value,price:+price.value||0,stock:+stock.value||0,image:imgs[0]||'',images:imgs,description:description.value.trim()};if(!obj.title)return alert('Title required');if(editId)Object.assign(data.find(x=>x.id===editId),obj);else{obj.id=Math.max(0,...data.map(x=>x.id))+1;data.push(obj)}editId=null;document.querySelectorAll('.form input,.form textarea').forEach(x=>x.value='');render()}function edit(id){const p=data.find(x=>x.id===id);editId=id;title.value=p.title;vendor.value=p.vendor;type.value=p.type||'';category.value=p.category||'Skin Care';price.value=p.price;stock.value=p.stock;description.value=p.description||'';[1,2,3,4,5,6].forEach((n,i)=>document.getElementById('image'+n).value=(p.images||[p.image])[i]||'');scrollTo({top:0,behavior:'smooth'})}function del(id){if(confirm('Delete product?')){data=data.filter(x=>x.id!==id);render()}}function downloadJson(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='products.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}init();</script></body></html>
